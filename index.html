<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>道具压缩包整理工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body{margin:0;background:#f6f8fa;color:#1f2328;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:48px auto;padding:0 20px}.panel{background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:28px;box-shadow:0 2px 8px #1f23280d}h1{margin:0 0 8px;font-size:26px}p{line-height:1.6;color:#57606a}.field{margin:22px 0}.field label{display:block;font-weight:600;margin-bottom:8px}input,select,button{font:inherit}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d0d7de;border-radius:6px;background:#fff}button{padding:10px 16px;border:0;border-radius:6px;background:#0969da;color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#fff;color:#0969da;border:1px solid #d0d7de}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:26px}.hidden{display:none}.status{margin:16px 0;padding:12px;background:#ddf4ff;border-radius:6px}.error{background:#ffebe9;color:#cf222e}.log{width:100%;border-collapse:collapse;margin:16px 0}.log td{padding:10px;border-bottom:1px solid #d8dee4}.keep{color:#1a7f37}.remove{color:#cf222e}.note{font-size:14px}.footer{margin-top:18px;font-size:13px;color:#57606a}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel" id="step1">
      <h1>道具压缩包整理工具</h1>
      <p>上传 ZIP 文件并选择道具种类。工具会识别资源、清理多余文件、生成规范命名和 <code>meta.json</code>。</p>
      <div class="field"><label for="zipFile">1. 上传 ZIP 文件</label><input id="zipFile" type="file" accept=".zip,application/zip"></div>
      <div class="field"><label for="propType">2. 选择道具种类</label><select id="propType"></select></div>
      <div class="field"><label for="thumbFile">3. 缩略图资源（ZIP 内缺少时补充）</label><input id="thumbFile" type="file" accept=".png,image/png"><p class="note" id="thumbHelp"></p></div>
      <div id="message" class="status hidden"></div>
      <div class="actions"><button id="process">处理并预览</button></div>
    </section>
    <section class="panel hidden" id="step2">
      <h1>预览处理结果</h1>
      <p id="summary"></p>
      <table class="log"><tbody id="log"></tbody></table>
      <div class="actions"><button class="secondary" id="back">返回修改</button><button id="download">下载整理后的 ZIP</button></div>
    </section>
    <p class="footer">所有文件仅在你的浏览器中处理，不会上传到服务器。</p>
  </main>
  <script>
    const TYPES={
      "单人头像框":{meta:null,slots:[],numberedImages:true,allow:["image"]},
      "双人头像框":{meta:{relative_x:.5,relative_y:.5,ratio_size:.5},slots:["self_frame","other_frame"],allow:["image"]},
      "麦位标签":{meta:null,slots:[],numberedImages:true,allow:["image"]},
      "普通图片进场特效":{meta:null,slots:["body","bottom"],allow:["image"]},
      "MP4/VAP 进场特效":{meta:null,slots:["animated","p"],allow:["image","video","json"]},
      "双人进场特效":{meta:{mode:"double",show_type:"0",relative_x:.5,relative_y:.5,ratio_size:.5},slots:["animated","p","self_frame","peer_frame","peer_avatar"],allow:["image","video","json"]},
      "普通图片礼物":{meta:{type:"normal"},slots:["effect","thumb"],requiresThumb:true,allow:["image"]},
      "普通爆屏/MP4 礼物":{meta:{showType:"blast"},slots:["animated","p","thumb"],requiresThumb:true,allow:["image","video","json"]},
      "爆屏单人头像礼物":{meta:{type:"avatar",showType:"blast",avatarMode:"single"},slots:["animated","p","thumb"],requiresThumb:true,allow:["image","video","json"]},
      "爆屏双人头像礼物":{meta:{type:"avatar",showType:"blast",avatarMode:"double"},slots:["animated","p","thumb"],requiresThumb:true,allow:["image","video","json"]}
    };
    const imageExt=["png","jpg","jpeg","webp"],videoExt=["mp4","vap"];
    const typeSelect=document.getElementById("propType"),msg=document.getElementById("message");
    Object.assign(TYPES,{
      "魔法音浪":{special:"numbered",max:10},"握手特效":{special:"numbered",max:8},
      "麦位表情：普通动态":{special:"emojiAnimated",requiresThumb:true},
      "麦位表情：多结果（骰子等）":{special:"emojiMultiple",requiresThumb:true},
      "麦位表情：纯静态":{special:"emojiStatic",requiresThumb:true},
      "资料卡皮肤：单人":{special:"skinSingle"},"资料卡皮肤：双人":{special:"skinDual"},
      "房间背景：静态":{special:"backgroundImage"},"房间背景：动态":{special:"backgroundVideo"}
    });
    Object.keys(TYPES).forEach(n=>typeSelect.add(new Option(n,n)));
    const THUMB_SIZES={"普通图片礼物":[200,200],"普通爆屏/MP4 礼物":[200,200],"爆屏单人头像礼物":[200,200],"爆屏双人头像礼物":[200,200],"魔法音浪":[160,160],"握手特效":[200,200],"麦位表情：普通动态":[150,150],"麦位表情：多结果（骰子等）":[150,150],"麦位表情：纯静态":[150,150],"资料卡皮肤：单人":[108,108],"资料卡皮肤：双人":[108,108],"房间背景：静态":[260,416],"房间背景：动态":[260,416]};
    function thumbHelp(){const s=THUMB_SIZES[typeSelect.value];document.getElementById('thumbHelp').textContent='优先读取 ZIP 内'+(s?s.join('×')+' 像素的 PNG':'已命名为 thumb.png 的 PNG')+'，自动命名为 thumb.png；找不到时才使用外部上传资源。'+(typeSelect.value.startsWith('房间背景')?'商城缩略图为 260×416，108×108 的 H5 缩略图不会混用。':'')+' 支持内层 ZIP；预览记录会显示图片实际尺寸。';}
    typeSelect.onchange=thumbHelp;thumbHelp();
    async function pngSize(bytes){const b=new Uint8Array(bytes);if(b.length<24||![137,80,78,71,13,10,26,10].every((v,i)=>b[i]===v)||String.fromCharCode(...b.slice(12,16))!=='IHDR')return null;const v=new DataView(b.buffer,b.byteOffset,b.byteLength);return [v.getUint32(16),v.getUint32(20)];}
    async function findThumbnail(source,type,external){
      const spec=TYPES[type],size=THUMB_SIZES[type];if(!spec.requiresThumb&&!size&&!external)return null;
      const candidates=[];
      for(const f of Object.values(source.files)){if(f.dir||!f.name.toLowerCase().endsWith('.png')||f.name.split('/').some(p=>p.startsWith('.')||p==='__MACOSX'))continue;const named=f.name.split('/').pop().toLowerCase()==='thumb.png';if(TYPES[type].special==='numbered'&&/^[1-9]\d*\.png$/i.test(f.name.split('/').pop()))continue;if(!size&&!named)continue;const data=await f.async('uint8array'),actual=await pngSize(data);if(actual&&(!size||actual.every((v,i)=>v===size[i])))candidates.push({file:f,data,named});}
      const named=candidates.filter(c=>c.named),matches=named.length?named:candidates;
      if(matches.length===1)return {...matches[0],origin:'ZIP 内按尺寸识别'};
      if(matches.length>1&&!external)throw Error('ZIP 内有多张匹配缩略图：'+matches.map(c=>c.file.name).join('、')+'。请将所需图片命名为 thumb.png，或通过缩略图资源上传明确选择。');
      if(external){const data=new Uint8Array(await external.arrayBuffer()),actual=await pngSize(data);if(!actual)throw Error('外部缩略图不是有效的 PNG 文件');if(size&&!actual.every((v,i)=>v===size[i]))throw Error('缩略图尺寸应为 '+size.join('×')+'，实际为 '+actual.join('×'));return {data,origin:'外部补充',name:external.name};}return null;
    }
    let resultZip,resultName;
    async function expandNestedZip(root){
      const merged=new JSZip(),state={count:0,bytes:0,archives:0};
      async function walk(zip,prefix,depth){
        for(const f of Object.values(zip.files)){
          if(f.dir||f.name.split('/').some(p=>p.startsWith('.')||p==='__MACOSX'))continue;
          if(++state.count>5000)throw Error('压缩包内文件过多（最多 5000 个），请拆分处理');
          const data=await f.async('uint8array');state.bytes+=data.byteLength;
          if(state.bytes>300*1024*1024)throw Error('解压数据超过 300MB，请拆分压缩包');
          const path=prefix+f.name;
          if(/\.zip$/i.test(f.name)){
            if(depth>=5)throw Error('ZIP 嵌套超过 5 层，请先手动整理');
            let inner;try{inner=await JSZip.loadAsync(data);}catch{throw Error('无法解压内层 ZIP（可能损坏或加密）：'+path);}
            state.archives++;await walk(inner,path+'/',depth+1);
          }else{
            if(merged.file(path))throw Error('内层资源路径重复：'+path);
            merged.file(path,data);
          }
        }
      }
      await walk(root,'',0);return {source:merged,archives:state.archives};
    }
    function kind(name){const ext=name.split(".").pop().toLowerCase();return imageExt.includes(ext)?"image":videoExt.includes(ext)?"video":ext==="json"?"json":"other"}
    function ext(name){return "."+name.split(".").pop().toLowerCase()}
    function suggested(name,k,used){const n=name.toLowerCase();if(k==="video")return used.has("animated"+ext(name))?null:"animated"+ext(name);if(k==="json")return used.has("p.json")?null:"p.json";if(/self|current/.test(n))return "self_frame"+ext(name);if(/other|peer|target/.test(n))return "other_frame"+ext(name);if(/avatar/.test(n))return "peer_avatar"+ext(name);if(/thumb|icon/.test(n))return "thumb"+ext(name);if(/bottom/.test(n))return "bottom"+ext(name);if(/body/.test(n))return "body"+ext(name);if(/effect/.test(n))return "effect"+ext(name);return null}
    async function arrangeSpecial(source,spec,type,out,records,used){
      const files=Object.values(source.files).filter(f=>!f.dir&&!f.name.split('/').some(p=>p.startsWith('.')||p==='__MACOSX')).sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true}));
      const picked=new Set(),base=f=>f.name.split('/').pop(),stem=f=>base(f).replace(/\.[^.]+$/,'').toLowerCase();
      const image=f=>kind(base(f))==='image',png=f=>ext(base(f))==='.png',webp=f=>ext(base(f))==='.webp',video=f=>ext(base(f))==='.mp4';
      async function put(f,target){if(!f)return null;if(used.has(target))throw Error('目标文件重复：'+target);out.file(target,await f.async('uint8array'));picked.add(f);used.add(target);records.push(['保留',f.name,'重命名为 '+target]);return target;}
      async function take(names,predicate,target,required=false){let candidates=files.filter(f=>!picked.has(f)&&predicate(f));let f=names.map(n=>candidates.find(f=>stem(f)===n)).find(Boolean);if(!f&&candidates.length===1)f=candidates[0];if(!f&&required)throw Error(candidates.length?'有多个候选资源，请先按用途命名：'+names.join(' / '):'缺少资源：'+names[0]);return put(f,f?(target||names[0])+ext(base(f)):null);}
      async function meta(value){out.file('meta.json',JSON.stringify(value,null,2));used.add('meta.json');records.push(['生成','meta.json','写入道具配置']);}
      let original={};const metaFiles=files.filter(f=>base(f).toLowerCase()==='meta.json');if(metaFiles.length>1)throw Error('包含多套配置，请只上传本次需要的一套素材');if(metaFiles.length){try{original=JSON.parse(await metaFiles[0].async('string'));}catch{throw Error('meta.json 格式错误，请修正后重试');}}
      if(type.includes('进场特效')){
        const double=type==='双人进场特效',picture=type==='普通图片进场特效';
        if(!picture){await take(['animated','body'],video,'animated',true);const configs=files.filter(f=>base(f).toLowerCase()==='p.json');if(configs.length>1)throw Error('存在多个 p.json，请仅保留配套配置');if(configs[0]){try{JSON.parse(await configs[0].async('string'));}catch{throw Error('p.json 无法解析，请使用交付的原始配置');}await put(configs[0],'p.json');}else records.push(['提示','缺少 p.json','VAP 素材请补充原始配置，不能保证当前比例正确']);}
        if(!picture){
          const art=[];for(const f of files.filter(image)){const a=await readImageAsset(f);art.push(a);records.push(['检查',f.name,a.width+'×'+a.height]);}
          const bottom=chooseAsset(art.filter(a=>['.png','.webp'].includes(a.extension)),['bottom'],[[482,114],[600,100]],false,'进场底板');
          if(bottom)await put(bottom.file,'bottom'+bottom.extension);
          const body=chooseAsset(art.filter(a=>!picked.has(a.file)&&!['thumb','icon','self_frame','sender_avatar_frame','peer_frame','other_frame','peer_avatar_frame','peer_avatar','avatar'].includes(a.stem)),['body','main'],[[190,190],[500,500]],false,'进场图片兜底主体');
          if(body)await put(body.file,'body'+body.extension);
        }else{
          const reserved=f=>!['bottom','thumb','icon','self_frame','peer_frame','other_frame','peer_avatar','avatar'].includes(stem(f));
          await take(['body','main'],f=>image(f)&&reserved(f),'body',true);
          await take(['bottom'],f=>image(f)&&stem(f)==='bottom','bottom');
        }
        if(double){await take(['self_frame','sender_avatar_frame'],f=>image(f)&&['self_frame','sender_avatar_frame'].includes(stem(f)),'self_frame');await take(['peer_frame','other_frame','peer_avatar_frame'],f=>image(f)&&['peer_frame','other_frame','peer_avatar_frame'].includes(stem(f)),'peer_frame');await take(['peer_avatar','avatar'],f=>image(f)&&['peer_avatar','avatar'].includes(stem(f)),'peer_avatar');await meta({...original,mode:'double',show_type:'0'});}
        else if(original.show_type==='0'||original.showType==='0')await meta({show_type:'0'});
      }else if(spec.special==='numbered'){
        for(const f of files.filter(image)){const n=Number(stem(f));if(!Number.isInteger(n)||n<1||n>spec.max)throw Error('请按固定麦位/握手组编号命名为 1 至 '+spec.max+'，不可自动重排：'+base(f));await put(f,n+ext(base(f)));}if(!used.size)throw Error('缺少图片资源');
      }else if(spec.special.startsWith('skin')){
        const main=await take(['main'],webp,'main',true),m={mode:spec.special==='skinDual'?'dual':'single',main};
        if(m.mode==='dual'){const frame=await take(['peer_frame'],f=>image(f)&&stem(f)==='peer_frame','peer_frame'),avatar=await take(['peer_avatar'],f=>image(f)&&stem(f)==='peer_avatar','peer_avatar');if(frame)m.peer_frame=frame;if(avatar)m.peer_avatar=avatar;for(const [key,fallback] of Object.entries({relative_x:.7,relative_y:.24,ratio_size:.17})){const v=original[key]??fallback;if(typeof v!=='number'||v<0||v>1||(key==='ratio_size'&&v===0))throw Error(key+' 必须为有效比例数值');m[key]=v;}}await meta(m);
      }else if(spec.special.startsWith('background')){
        const imagePath=await take(['background'],png,'background',true),m={type:'image',image:imagePath};if(spec.special==='backgroundVideo'){m.type='video';m.video=await take(['background'],video,'background',true);}await meta(m);
      }else if(spec.special.startsWith('emoji')){
        const m={thumb:'thumb.png'},thumb=files.find(f=>stem(f)==='thumb'&&png(f));if(thumb)await put(thumb,'thumb.png');
        if(spec.special==='emojiAnimated'){const result=await take(['result'],webp,'result',true);m.animation=result;m.results=[result];}
        else if(spec.special==='emojiStatic'){const result=files.find(f=>stem(f)==='result'&&png(f));if(!result&&thumb&&files.filter(png).length===1)m.results=[await put(thumb,'result.png')];else m.results=[await take(['result'],png,'result',true)];}
        else {m.animation=await take(['animation'],webp,'animation',true);const results=files.filter(f=>!picked.has(f)&&image(f)&&stem(f)!=='thumb');if(!results.length)throw Error('缺少多结果表情图片');m.results=[];for(const [i,f] of results.entries())m.results.push(await put(f,'results/'+(i+1)+ext(base(f))));}await meta(m);
      }
      for(const f of files)if(!picked.has(f)&&base(f).toLowerCase()!=='meta.json')records.push(['删除',f.name,'未用于当前道具']);
    }
    async function readImageAsset(file){
      const data=await file.async('uint8array');let bitmap;
      try{bitmap=await createImageBitmap(new Blob([data]));}catch{throw Error('图片无法解码：'+file.name);}
      const info={width:bitmap.width,height:bitmap.height,animated:false};bitmap.close();
      if(ext(file.name)==='.webp'){const view=new DataView(data.buffer,data.byteOffset,data.byteLength);for(let i=12;i+8<=data.length;){const tag=String.fromCharCode(...data.slice(i,i+4)),length=view.getUint32(i+4,true);if(tag==='ANIM'||tag==='ANMF')info.animated=true;if(length>data.length-i-8)break;i+=8+length+(length%2);}}
      return {...info,data,file,stem:file.name.split('/').pop().replace(/\.[^.]+$/,'').toLowerCase(),extension:ext(file.name)};
    }
    function chooseAsset(assets,names,sizes,required,label){
      const valid=assets.filter(a=>(!sizes||sizes.some(([w,h])=>a.width===w&&a.height===h)));
      const named=valid.filter(a=>names.includes(a.stem));const choices=named.length?named:valid;
      if(choices.length>1)throw Error(label+' 有多个同尺寸候选，请仅保留一套或将目标命名为 '+names[0]+'：'+choices.map(a=>a.file.name).join('、'));
      if(choices.length===1)return choices[0];
      if(required)throw Error('缺少'+label+(sizes?'（'+sizes.map(s=>s.join('×')).join(' / ')+'）':'')+'，请检查实际尺寸');return null;
    }
    async function arrangeDimensions(source,spec,type,out,records,used){
      const files=Object.values(source.files).filter(f=>!f.dir),assets=[];const selected=new Set();
      for(const f of files)if(kind(f.name)==='image'){const a=await readImageAsset(f);assets.push(a);records.push(['检查',f.name,a.width+'×'+a.height+(a.animated?' 动态 WebP':'')]);}
      const metas=files.filter(f=>f.name.split('/').pop().toLowerCase()==='meta.json');if(metas.length>1)throw Error('存在多套 meta.json，请只保留一套道具');let original={};if(metas.length){try{original=JSON.parse(await metas[0].async('string'));}catch{throw Error('meta.json 格式错误');}}
      async function put(a,role){if(!a)return null;const target=role+a.extension;if(used.has(target))throw Error('重复目标：'+target);out.file(target,a.data);used.add(target);selected.add(a);records.push(['保留',a.file.name,'按尺寸识别为 '+target]);return target;}
      async function take(names,sizes,required,label,predicate=()=>true){const a=chooseAsset(assets.filter(a=>!selected.has(a)&&predicate(a)),names,sizes,required,label||names[0]);return put(a,names[0]);}
      function meta(m){out.file('meta.json',JSON.stringify(m,null,2));used.add('meta.json');records.push(['生成','meta.json','按 Wiki 写入配置']);}
      function ratios(defaults){const r={};for(const [k,d] of Object.entries(defaults)){const n=original[k]??d;if(typeof n!=='number'||!Number.isFinite(n)||n<0||n>1||(k==='ratio_size'&&n===0))throw Error(k+' 必须是有效比例数值');r[k]=n;}return r;}
      if(type==='单人头像框'||type==='麦位标签'||spec.special==='numbered'){
        const sizes=type==='单人头像框'?[[200,250]]:type==='麦位标签'?[[64,64]]:type==='魔法音浪'?[[300,300]]:[[200,200]];
        const matching=assets.filter(a=>sizes.some(([w,h])=>a.width===w&&a.height===h));if(!matching.length)throw Error('缺少规范尺寸资源：'+sizes[0].join('×'));
        const ids=new Set();for(const a of matching){let id=a.stem;if(!/^[1-9]\d*$/.test(id)){if(matching.length===1&&spec.special!=='numbered')id='1';else throw Error('尺寸不能确定麦位编号，请命名为纯数字：'+a.file.name);}if(Number(id)>(spec.max||10)||ids.has(id))throw Error('编号超出范围或重复：'+id);ids.add(id);await put(a,id);}
      }else if(type==='双人头像框'){
        await take(['self_frame'],[[200,250]],true,'主头像框');await take(['other_frame','peer_frame'],[[100,100]],true,'副头像框');meta(ratios({relative_x:.5,relative_y:.5,ratio_size:.5}));
      }else if(type==='普通图片进场特效'){
        await take(['body','main'],[[190,190],[500,500]],true,'进场主体');await take(['bottom'],[[482,114],[600,100]],false,'底板');if(original.show_type==='0'||original.showType==='0')meta({show_type:'0'});
      }else if(spec.special?.startsWith('skin')){
        const main=await take(['main'],[[720,362]],true,'资料卡主体'),m={mode:spec.special==='skinDual'?'dual':'single',main};
        if(m.mode==='dual'){for(const role of ['peer_frame','peer_avatar']){const p=await take([role],null,false,role,a=>a.stem===role);if(p)m[role]=p;}Object.assign(m,ratios({relative_x:.7,relative_y:.24,ratio_size:.17}));}meta(m);
      }else if(spec.special?.startsWith('background')){
        const imagePath=await take(['background'],[[1500,2668]],true,'背景静态图'),m={type:'image',image:imagePath};
        if(spec.special==='backgroundVideo'){const videos=files.filter(f=>ext(f.name)==='.mp4');if(videos.length!==1)throw Error('动态背景需要唯一一个 MP4 文件');const f=videos[0],data=await f.async('uint8array'),url=URL.createObjectURL(new Blob([data],{type:'video/mp4'}));try{const v=document.createElement('video');v.preload='metadata';const size=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{v.removeAttribute('src');v.load();reject(Error('背景视频尺寸读取超时'));},15000);v.onloadedmetadata=()=>{clearTimeout(timer);resolve([v.videoWidth,v.videoHeight]);};v.onerror=()=>{clearTimeout(timer);reject(Error('背景视频无法读取'));};v.src=url;});if(size[0]!==750||size[1]!==1334)throw Error('背景视频应为 750×1334，实际 '+size.join('×'));out.file('background.mp4',data);used.add('background.mp4');records.push(['保留',f.name,'750×1334 → background.mp4']);m.type='video';m.video='background.mp4';}finally{URL.revokeObjectURL(url);}}meta(m);
      }else if(spec.special?.startsWith('emoji')){
        const m={thumb:'thumb.png'},valid=a=>a.width===150&&a.height===150;
        if(spec.special==='emojiStatic'){m.results=[await take(['result'],[[150,150]],true,'静态表情',a=>a.extension==='.png')];}
        else{const role=spec.special==='emojiAnimated'?'result':'animation';m.animation=await take([role],[[150,150]],true,'动态表情',a=>a.extension==='.webp'&&a.animated);if(spec.special==='emojiAnimated')m.results=[m.animation];else{m.results=[];const results=assets.filter(a=>!selected.has(a)&&valid(a)&&a.stem!=='thumb').sort((a,b)=>a.file.name.localeCompare(b.file.name,'en',{numeric:true}));if(!results.length)throw Error('缺少 150×150 表情结果图');for(const [i,a] of results.entries())m.results.push(await put(a,'results/'+(i+1)));}}meta(m);
      }else if(type==='普通图片礼物'){await take(['effect'],null,true,'礼物主体',a=>a.stem!=='thumb');meta({type:'normal'});records.push(['提示','礼物主体尺寸','画板未给普通图片礼物唯一主体尺寸，按唯一非缩略图资源识别，不强制缩放']);}
      for(const a of assets)if(!selected.has(a))records.push(['删除',a.file.name,'未匹配当前道具的资源用途']);
    }
    function showError(text){msg.textContent=text;msg.className="status error"}
    document.getElementById("process").onclick=async()=>{
      const file=document.getElementById("zipFile").files[0],thumbFile=document.getElementById("thumbFile").files[0];if(!file)return showError("请先选择 ZIP 文件。");if(thumbFile&&!/\.png$/i.test(thumbFile.name))return showError("缩略图资源请上传 PNG 文件。");if(!window.JSZip)return showError("压缩包组件加载失败，请检查网络后重试。");
      msg.className="status";msg.textContent="正在解压并整理…";
      try{
        const expanded=await expandNestedZip(await JSZip.loadAsync(file)),source=expanded.source,spec=TYPES[typeSelect.value],out=new JSZip(),used=new Set(),images=[],records=[];
        if(expanded.archives)records.push(['提示','已解压 '+expanded.archives+' 个内层 ZIP','统一读取内部素材，导出时不保留 ZIP 嵌套目录']);
        const thumbnail=await findThumbnail(source,typeSelect.value,thumbFile);
        if(thumbnail&&thumbnail.file&&spec.special!=='emojiStatic')source.remove(thumbnail.file.name);
        const preserveVap=typeSelect.value==='MP4/VAP 进场特效'||typeSelect.value==='双人进场特效'||typeSelect.value.includes('爆屏');
        if(!preserveVap){await arrangeDimensions(source,spec,typeSelect.value,out,records,used);}else if(spec.special||typeSelect.value.includes('进场特效')){await arrangeSpecial(source,spec,typeSelect.value,out,records,used);}else{
        for(const [path,item] of Object.entries(source.files)){
          if(item.dir)continue;const base=path.split("/").pop(),k=kind(base);
          if(base.toLowerCase()==="meta.json")continue;
          if(!spec.allow.includes(k)){records.push(["删除",base,"不支持的格式"]);continue;}
          let target;if(typeSelect.value==="MP4/VAP 进场特效"&&k==="image"){const extension=ext(base);target=extension===".webp"?"animated.webp":extension===".png"?"bottom.png":null;}else{target=suggested(base,k,used);}if(!target&&k==="image"){if(typeSelect.value==="MP4/VAP 进场特效"){records.push(["删除",base,"仅支持 WEBP 或 PNG 素材"]);continue;}images.push({base,item});continue;}
          if(!target||used.has(target)){records.push(["删除",base,"重复或无法识别"]);continue;}
          out.file(target,await item.async("uint8array"));used.add(target);records.push(["保留",base,`重命名为 ${target}`]);
        }
        const imageSlots=spec.slots.filter(x=>!['animated','p'].includes(x));
        images.forEach(({base,item},i)=>{const slot=spec.numberedImages?String(i+1):imageSlots[i];if(!slot){records.push(["删除",base,"超出所需图片数量"]);return;}const target=slot+ext(base);if(used.has(target)){records.push(["删除",base,`${target} 已存在`]);return;}out.file(target,item.async("uint8array"));used.add(target);records.push(["保留",base,`重命名为 ${target}`]);});
        if(spec.meta){out.file("meta.json",JSON.stringify(spec.meta,null,2));records.push(["生成","meta.json","写入道具配置"]);}
        }
        if(thumbnail){out.file("thumb.png",thumbnail.data);used.add("thumb.png");records.push(["保留",thumbnail.file?.name||thumbnail.name,thumbnail.origin+"，输出 thumb.png"]);}
        if(spec.requiresThumb&&!used.has("thumb.png")){records.unshift(["提示","zip压缩包缺少缩略图，无法新增thumb.png资源。","请手动命名缩略图为【thumb.png】或补充资源后重新操作流程"]);}
        resultZip=await out.generateAsync({type:"blob"});resultName=`${typeSelect.value}_已整理.zip`;
        document.getElementById("summary").textContent=`道具种类：${typeSelect.value}；以下是文件处理记录。`;
        const log=document.getElementById("log");log.innerHTML="";records.forEach(r=>{const tr=document.createElement("tr"),missingThumb=r[0]==='提示'&&r[1]==='zip压缩包缺少缩略图，无法新增thumb.png资源。';r.forEach((value,i)=>{const td=document.createElement('td');td.textContent=value;if(missingThumb)td.className='remove';else if(i===0)td.className=r[0]==='保留'||r[0]==='生成'?'keep':'';tr.append(td);});log.append(tr)});
        document.getElementById("step1").classList.add("hidden");document.getElementById("step2").classList.remove("hidden");
      }catch(e){showError("处理失败："+e.message)}
    };
    document.getElementById("back").onclick=()=>{document.getElementById("step2").classList.add("hidden");document.getElementById("step1").classList.remove("hidden");msg.className="status hidden"};
    document.getElementById("download").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(resultZip);a.download=resultName;a.click();URL.revokeObjectURL(a.href)};
  </script>
</body>
